<!DOCTYPE html>
<html lang="uz-Cyrl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кибержиноятлар: ЖК моддалари бўйича тергов алгоритмлари</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1b1f24; --muted:#5b6470; --line:#dfe3e8;
  --accent:#1f5fae; --accent-soft:#e7effa; --warn:#a15c00; --warn-soft:#fff4e0;
  --crit:#a8261f; --crit-soft:#fdecea; --ok:#1d7a46; --ok-soft:#e6f4ec;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:#14325c;color:#fff;display:flex;align-items:center;gap:16px;padding:10px 18px}
header h1{font-size:17px;margin:0;font-weight:600;white-space:nowrap}
header .sp{flex:1}
header input{width:min(420px,40vw);padding:8px 12px;border-radius:6px;border:0;font-size:14px}
header button{background:#2b5a96;color:#fff;border:0;border-radius:6px;padding:8px 12px;font-size:13px;cursor:pointer}
header button:hover{background:#3a6db0}
.wrap{display:flex;height:calc(100vh - 54px)}
nav{width:330px;min-width:260px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px 0}
nav .grp{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:12px 16px 4px;font-weight:600}
nav a{display:block;padding:6px 16px;color:var(--ink);text-decoration:none;font-size:14px;border-left:3px solid transparent;cursor:pointer}
nav a:hover{background:#f0f3f7}
nav a.on{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
nav a:not(.sub){display:flex;gap:8px}
nav a .code{flex:none;width:78px;font-weight:600;color:var(--accent)}
nav a.sub{padding-left:40px;font-size:13px;color:var(--muted)}
nav a.sub.on{color:var(--ink)}
nav .tools a{font-weight:500}
main{flex:1;overflow:auto;padding:22px 30px 60px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--accent);cursor:pointer;text-decoration:none}
h2{font-size:22px;margin:4px 0 6px}
h3{font-size:17px;margin:22px 0 8px}
h4{font-size:15px;margin:14px 0 6px}
.lead{color:var(--muted);margin:0 0 14px;max-width:900px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:12px 0}
.row{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:150px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:6px 14px;font-size:13.5px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pill{display:inline-block;font-size:12px;border-radius:10px;padding:1px 8px;background:#eef1f5;color:var(--muted);margin-right:4px}
.note{background:var(--warn-soft);border-left:4px solid var(--warn);padding:10px 14px;border-radius:6px;margin:12px 0;font-size:14px}
.crit{background:var(--crit-soft);border-left:4px solid var(--crit);padding:10px 14px;border-radius:6px;margin:12px 0;font-size:14px}
.okb{background:var(--ok-soft);border-left:4px solid var(--ok);padding:10px 14px;border-radius:6px;margin:12px 0;font-size:14px}
.vers{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.vers div{background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.vers div b{color:var(--accent)}
.stage{border-left:3px solid var(--accent);margin:14px 0;padding:2px 0 2px 16px}
.stage.first{border-left-color:var(--crit)}
.stage h4{margin:0 0 6px;display:flex;align-items:center;gap:8px}
.stage h4 .cnt{font-size:12px;color:var(--muted);font-weight:400}
.step{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14.5px}
.step input{margin-top:4px;width:16px;height:16px;flex:none;cursor:pointer}
.step.done span{color:var(--muted);text-decoration:line-through}
.progress{height:8px;background:#e8ecf1;border-radius:4px;overflow:hidden;margin:6px 0 2px}
.progress i{display:block;height:100%;background:var(--ok);width:0}
.casebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:12px 0}
.casebar input{padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px}
.casebar button,.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
.casebar button:hover,.btn:hover{background:#f0f3f7}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--panel)}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:#eef2f7;font-weight:600}
td a{color:var(--accent);cursor:pointer;text-decoration:none}
ul{margin:6px 0;padding-left:22px}
li{margin:3px 0}
.wiz button{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:14.5px;cursor:pointer}
.wiz button:hover{background:var(--accent-soft);border-color:var(--accent)}
.res a{display:inline-block;margin:4px 6px 4px 0;padding:6px 12px;border-radius:6px;background:var(--accent-soft);color:var(--accent);text-decoration:none;cursor:pointer;font-weight:600}
.hl{background:#fff2a8}
.small{font-size:12.5px;color:var(--muted)}
@media (max-width:860px){nav{display:none}.wrap{height:auto}main{padding:16px}}
@media print{header,nav,.casebar,.tabs,.noprint{display:none!important}.wrap{display:block;height:auto}main{overflow:visible;padding:0}.card{break-inside:avoid}}
</style>
</head>

  <span class="sp"></span>
  <button onclick="go('wizard')">Малакани аниқлаш</button>

<div class="wrap">
  <nav id="nav"></nav>

function expand(steps){ const out=[]; for (const s of steps){ if (s.startsWith("@")){ const k=s.slice(1).split(" ")[0]; const rest=s.slice(1+k.length); (B[k]||[s]).forEach((x,i)=>out.push(i===0&&rest?x+rest:x)); } else out.push(s); } return out; }

 }

function tick(k,v){ if(v) ticks[k]=1; else delete ticks[k]; save(); renderArt(); }
function setCase(v){ caseNo=v.trim(); try{ ticks=JSON.parse(localStorage.getItem("kj_ticks_"+caseNo)||"{}"); }catch(e){ ticks={}; } save(); renderArt(); }
function clearCase(mid){ Object.keys(ticks).forEach(k=>{ if(k.startsWith(mid+"|")) delete ticks[k]; }); save(); renderArt(); }
function copyCase(mid){ const [a,m]=findM(mid); let t=`Иш: ${caseNo||"—"}\nЖК ${a.code} · ${m.n}\n`; m.stages.forEach((s,si)=>{ t+=`\n${s.t}\n`; expand(s.s).forEach((x,i)=>{ t+=`[${ticks[mid+"|"+si+"|"+i]?"x":" "}] ${x}\n`; }); }); navigator.clipboard?.writeText(t).then(()=>alertMsg("Нусхаланди"),()=>alertMsg("Нусхалаб бўлмади")); }
function alertMsg(s){ const d=document.createElement("div"); d.textContent=s; d.style.cssText="position:fixed;bottom:20px;right:20px;background:#14325c;color:#fff;padding:10px 16px;border-radius:8px;z-index:9"; document.body.appendChild(d); setTimeout(()=>d.remove(),1800); }

function renderSearch(q){
 const f=q.toLowerCase(); let r=`<h2>Қидирув: «${esc(q)}»</h2>`; let n=0;
 for (const a of ART) for (const m of a.m){
  const steps=m.stages.flatMap(s=>expand(s.s)); const blob=(a.code+" "+a.title+" "+m.n+" "+m.mech+" "+steps.join(" ")+" "+m.key).toLowerCase();
  if (!blob.includes(f)) continue; n++;
  const hit=steps.find(s=>s.toLowerCase().includes(f))||m.mech;
  r+=`<div class="card"><a style="font-weight:600;color:var(--accent);cursor:pointer" onclick="$('#q').value='';go('art','${a.id}','${m.id}')">ЖК ${a.code} · ${esc(m.n)}</a><div class="small">${hl(hit,f)}</div></div>`;
 }
 $("#main").innerHTML= n? r : r+'<p>Ҳеч нарса топилмади.</p>';
}
function hl(s,f){ const i=s.toLowerCase().indexOf(f); if(i<0) return esc(s); return esc(s.slice(0,i))+'<span class="hl">'+esc(s.slice(i,i+f.length))+'</span>'+esc(s.slice(i+f.length)); }
