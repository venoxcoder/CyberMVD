<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080e1b">
  <title>KIBERJINOYATLAR | Investigation Platform</title>
  <style>
:root {
  --bg: #080e1b;
  --panel: #101a2b;
  --panel2: #142137;
  --line: #23334b;
  --text: #eaf1fb;
  --muted: #8b9bb2;
  --accent: #36d6c3;
  --blue: #5797ff;
  --purple: #a78bfa;
  --orange: #ffb45e;
  --red: #ff6b78;
  --radius: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Inter, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

button, input, textarea, select { font: inherit; }
button { cursor: pointer; }

.app-shell { display: flex; min-height: 100vh; }

.sidebar {
  width: 260px;
  background: #0b1423;
  border-right: 1px solid var(--line);
  padding: 26px 17px;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 35px; }
.brand-mark {
  width: 43px; height: 43px; border-radius: 13px;
  display: grid; place-items: center;
  color: #06151a; font-size: 24px; font-weight: 900;
  background: linear-gradient(135deg, #52f0d6, #398cdb);
  box-shadow: 0 5px 25px #36d6c333;
}
.brand-name { font-size: 14px; font-weight: 800; letter-spacing: .5px; }
.brand-name span { color: var(--accent); }
.brand small { display: block; color: var(--muted); font-size: 9px; letter-spacing: 1.7px; margin-top: 5px; }

.side-label {
  color: #62738c; font-size: 10px; font-weight: 800;
  letter-spacing: 1.5px; padding: 14px 10px 10px;
}
.nav-menu { display: grid; gap: 5px; }
.nav-link {
  width: 100%; border: 0; background: transparent; color: #9eacc0;
  text-align: left; padding: 12px 13px; border-radius: 10px;
  font-size: 12px; font-weight: 600; transition: .2s;
}
.nav-icon { display: inline-block; width: 25px; color: #7f93ad; font-size: 17px; }
.nav-link:hover { background: #14243a; color: white; }
.nav-link.active {
  color: var(--accent); background: linear-gradient(90deg, #15343b, #122536);
  box-shadow: inset 3px 0 var(--accent);
}
.nav-link.active .nav-icon { color: var(--accent); }

.sidebar-bottom {
  margin-top: auto; padding: 15px 10px 0; border-top: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px;
}
.sidebar-bottom strong { display: block; font-size: 11px; }
.sidebar-bottom small { display: block; color: var(--muted); font-size: 10px; margin-top: 4px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }

.main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: 72px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 36px; background: #0b1423cc;
}
.breadcrumb { font-size: 12px; color: var(--muted); }
.breadcrumb span { margin: 0 10px; color: #53657d; }
.breadcrumb strong { color: var(--text); }
.topbar-right { display: flex; align-items: center; gap: 18px; }
.live-indicator { font-size: 10px; color: var(--accent); letter-spacing: 1px; font-weight: 800; }
.live-indicator i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 6px; }
.user-avatar {
  width: 34px; height: 34px; display: grid; place-items: center;
  border-radius: 50%; background: #203752; color: #a8d7ff; font-size: 11px; font-weight: 800;
}
.mobile-menu { display: none; background: none; border: 0; color: white; font-size: 22px; }

.page-content { width: 100%; max-width: 1500px; padding: 34px 36px 50px; margin: 0 auto; flex: 1; }
.footer {
  border-top: 1px solid var(--line); padding: 18px 36px;
  display: flex; justify-content: space-between; color: #65758c; font-size: 10px;
  letter-spacing: .5px;
}

.eyebrow { color: var(--accent); font-size: 10px; letter-spacing: 2px; font-weight: 800; margin-bottom: 12px; }
.page-title { font-size: clamp(25px, 3vw, 34px); font-weight: 800; letter-spacing: -1.2px; }
.page-subtitle { color: var(--muted); font-size: 13px; line-height: 1.7; margin-top: 9px; max-width: 720px; }
.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin: 30px 0 16px; }
.section-heading h2 { font-size: 15px; }
.section-heading p { font-size: 11px; color: var(--muted); margin-top: 5px; }

.hero {
  position: relative; overflow: hidden; border: 1px solid #24505a;
  border-radius: 22px; padding: 34px;
  background: radial-gradient(circle at 90% 20%, #1d555b66, transparent 30%),
              linear-gradient(120deg, #112c3a, #111d32 65%, #17213a);
}
.hero:after {
  content: "⌘"; position: absolute; right: 55px; top: 8px;
  font-size: 150px; color: #50e6d0; opacity: .07; font-weight: 900;
}
.hero h1 { font-size: clamp(26px, 4vw, 40px); max-width: 650px; line-height: 1.15; letter-spacing: -1.5px; }
.hero p { color: #a9bdca; font-size: 13px; line-height: 1.8; max-width: 600px; margin: 15px 0 22px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; position: relative; z-index: 1; }

.btn {
  border: 1px solid var(--line); background: var(--panel2); color: var(--text);
  padding: 11px 16px; border-radius: 9px; font-size: 11px; font-weight: 700;
  transition: .2s;
}
.btn:hover { transform: translateY(-2px); border-color: var(--accent); }
.btn-primary { background: var(--accent); color: #06201e; border-color: var(--accent); }
.btn-primary:hover { background: #68f0dc; }
.btn-quiet { background: transparent; }
.btn-danger { color: var(--red); border-color: #66313d; }

.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 20px; }
.stat-card, .panel, .feature-card, .crime-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
}
.stat-card { padding: 19px; }
.stat-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 11px; }
.stat-icon { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; background: #183a40; color: var(--accent); font-size: 16px; }
.stat-number { font-size: 27px; font-weight: 800; margin-top: 15px; }
.stat-note { font-size: 10px; color: var(--muted); margin-top: 5px; }

.two-columns { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; margin-top: 18px; }
.panel { padding: 21px; min-width: 0; }
.panel h3 { font-size: 14px; }
.panel-desc { color: var(--muted); font-size: 11px; margin-top: 6px; line-height: 1.6; }

.activity-list { display: grid; gap: 0; margin-top: 18px; }
.activity-item { display: flex; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.activity-item:last-child { border: 0; }
.activity-symbol { width: 33px; height: 33px; flex-shrink: 0; border-radius: 10px; background: #1c3048; display: grid; place-items: center; color: var(--accent); }
.activity-item strong { display: block; font-size: 11px; }
.activity-item small { display: block; color: var(--muted); margin-top: 5px; font-size: 10px; }

.feature-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  margin-top: 18px;
  width: 100%;
  align-items: stretch;
}

.feature-card {
  min-width: 0;
  width: 100%;
  height: 100%;
}
.feature-card:hover, .crime-card:hover { border-color: #3b8d91; transform: translateY(-3px); }
.feature-icon { width: 39px; height: 39px; display: grid; place-items: center; border-radius: 11px; background: #18383d; color: var(--accent); font-size: 19px; margin-bottom: 15px; }
.feature-card h3 { font-size: 13px; }
.feature-card p { font-size: 11px; color: var(--muted); line-height: 1.7; margin-top: 8px; }

.toolbar { display: flex; gap: 10px; margin: 22px 0 17px; flex-wrap: wrap; }
.search-box, .field, .select-field, .text-field {
  background: #0d1727; border: 1px solid var(--line); border-radius: 9px;
  color: var(--text); padding: 12px 13px; outline: none; width: 100%; font-size: 12px;
}
.search-box { flex: 1; min-width: 220px; }
.search-box:focus, .field:focus, .select-field:focus, .text-field:focus { border-color: var(--accent); }
.select-field { width: auto; min-width: 160px; }
.crime-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 13px; }
.crime-card { padding: 19px; transition: .2s; }
.tag { display: inline-block; color: var(--accent); background: #17363a; padding: 5px 8px; border-radius: 5px; font-size: 9px; font-weight: 800; letter-spacing: .5px; }
.crime-card h3 { font-size: 14px; margin: 12px 0 8px; }
.crime-card p { font-size: 11px; line-height: 1.7; color: var(--muted); }
.card-bottom { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--line); }
.card-bottom small { color: var(--muted); font-size: 10px; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
.form-group { display: grid; gap: 8px; }
.form-group.full { grid-column: 1 / -1; }
.form-group label { color: #aab9cb; font-size: 11px; font-weight: 600; }
.text-field { min-height: 100px; resize: vertical; }
.result-box { padding: 18px; background: #102c32; border: 1px solid #28615e; border-radius: 12px; margin-top: 18px; }
.result-box h3 { color: var(--accent); font-size: 13px; margin-bottom: 8px; }
.result-box p { font-size: 12px; line-height: 1.7; color: #c3d5df; }

.steps { display: grid; gap: 12px; margin-top: 20px; }
.step-item { display: flex; gap: 15px; padding: 17px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.step-number { width: 31px; height: 31px; flex-shrink: 0; display: grid; place-items: center; background: #183c43; color: var(--accent); border-radius: 9px; font-weight: 800; font-size: 12px; }
.step-item h3 { font-size: 12px; margin: 2px 0 7px; }
.step-item p { font-size: 11px; color: var(--muted); line-height: 1.7; }

.check-list { display: grid; gap: 10px; margin-top: 18px; }
.check-item { display: flex; align-items: flex-start; gap: 11px; padding: 13px; background: #0d1727; border: 1px solid var(--line); border-radius: 10px; font-size: 11px; line-height: 1.6; }
.check-item input { accent-color: var(--accent); margin-top: 2px; }
.check-item.done span { color: #71849a; text-decoration: line-through; }
.progress-track { height: 7px; background: #26354a; border-radius: 10px; overflow: hidden; margin-top: 13px; }
.progress-fill { height: 100%; background: var(--accent); width: 0; transition: .3s; }

.empty-state { padding: 35px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; font-size: 12px; grid-column: 1 / -1; }
.toast {
  position: fixed; bottom: 25px; right: 25px; background: #173b3b; color: var(--accent);
  border: 1px solid #28645d; padding: 13px 18px; border-radius: 10px;
  font-size: 12px; opacity: 0; transform: translateY(10px); pointer-events: none; transition: .25s;
}
.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 1050px) {
  .sidebar { width: 225px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .feature-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 760px) {
  .sidebar { position: fixed; z-index: 20; left: -270px; top: 0; bottom: 0; transition: .25s; width: 260px; }
  .sidebar.open { left: 0; }
  .mobile-menu { display: block; margin-right: 12px; }
  .topbar { padding: 0 17px; justify-content: flex-start; }
  .topbar-right { margin-left: auto; }
  .page-content { padding: 24px 17px 35px; }
  .footer { padding: 16px 17px; }
  .two-columns { grid-template-columns: 1fr; }
  .crime-grid { grid-template-columns: 1fr; }
  .hero { padding: 25px; }
  .hero:after { right: 5px; font-size: 100px; }
}
@media (max-width: 480px) {
  .stats-grid, .feature-grid, .form-grid { grid-template-columns: 1fr; }
  .form-group.full { grid-column: auto; }
  .breadcrumb { font-size: 10px; }
  .live-indicator { display: none; }
  .footer { font-size: 9px; }
}
/* Переключатель языков */
.language-select {
  background: #12243a;
  color: #edf4ff;
  border: 1px solid #29415d;
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  outline: none;
  min-width: 145px;
}

.language-select:hover,
.language-select:focus {
  border-color: #39c6b4;
  box-shadow: 0 0 0 3px #39c6b422;
}

.language-select option {
  background: #0d1b2d;
  color: #edf4ff;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 14px;
}

@media(max-width:600px) {
  .language-select {
    min-width: 115px;
    font-size: 12px;
    padding: 8px;
  }

  .topbar-right {
    gap: 7px;
  }
}

/* ==========================================
   KIBERJINOYATLAR — THEME SYSTEM
========================================== */

/* DARK THEME */
:root,
[data-theme="dark"] {
  color-scheme: dark;

  --bg: #080e1b;
  --panel: #101a2b;
  --panel2: #142137;
  --line: #23334b;
  --text: #eaf1fb;
  --muted: #8b9bb2;

  --sidebar-bg: #0b1423;
  --topbar-bg: #0b1423;
  --input-bg: #0d1727;
  --hover-bg: #14243a;
  --secondary-text: #aab9cb;
}

/* LIGHT THEME */
[data-theme="light"] {
  color-scheme: light;

  --bg: #f2f5fa;
  --panel: #ffffff;
  --panel2: #edf2f8;
  --line: #dce4ef;
  --text: #172338;
  --muted: #64748b;

  --sidebar-bg: #ffffff;
  --topbar-bg: #ffffff;
  --input-bg: #f8fafc;
  --hover-bg: #edf3f9;
  --secondary-text: #475569;
}

/* BODY */
body {
  background: var(--bg);
  color: var(--text);
}

/* SIDEBAR */
.sidebar {
  background: var(--sidebar-bg);
  border-color: var(--line);
}

/* TOPBAR */
.topbar {
  background: var(--topbar-bg);
  border-color: var(--line);
}

/* MAIN CONTENT */
.main-area,
.page-content {
  background: var(--bg);
}

/* CARDS AND PANELS */
.stat-card,
.panel,
.feature-card,
.crime-card,
.step-item {
  background: var(--panel);
  border-color: var(--line);
  color: var(--text);
}

/* NAVIGATION */
.nav-link {
  color: var(--secondary-text);
}

.nav-link:hover {
  background: var(--hover-bg);
  color: var(--text);
}

.nav-link.active {
  color: var(--accent);
  background: var(--hover-bg);
}

/* INPUTS */
.search-box,
.field,
.select-field,
.text-field,
.check-item {
  background: var(--input-bg);
  color: var(--text);
  border-color: var(--line);
}

.form-group label {
  color: var(--secondary-text);
}

/* SELECTORS */
.language-select {
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--line);
}

.language-select option {
  background: var(--panel);
  color: var(--text);
}

/* TEXT */
.page-title,
.section-heading h2,
.panel h3,
.crime-card h3,
.feature-card h3,
.step-item h3,
.stat-number {
  color: var(--text);
}

.page-subtitle,
.panel-desc,
.feature-card p,
.crime-card p,
.step-item p,
.stat-note,
.activity-item small {
  color: var(--muted);
}

/* BORDERS */
.footer,
.activity-item,
.card-bottom {
  border-color: var(--line);
}

/* OTHER ELEMENTS */
.sidebar-bottom,
.topbar,
.panel,
.stat-card,
.feature-card,
.crime-card,
.step-item,
.search-box,
.field,
.select-field,
.text-field,
.language-select {
  transition:
    background-color .25s ease,
    color .25s ease,
    border-color .25s ease;
}

/* ==========================================
   LIGHT THEME — overrides for hard-coded dark colours
========================================== */
[data-theme="light"] {
  --accent: #0b8f80;
}
[data-theme="light"] .brand-name,
[data-theme="light"] .sidebar-bottom strong { color: var(--text); }
[data-theme="light"] .nav-icon { color: #7b8aa0; }
[data-theme="light"] .nav-link.active { box-shadow: inset 3px 0 var(--accent); }
[data-theme="light"] .hero {
  border-color: #bfe3df;
  background: radial-gradient(circle at 90% 20%, #7be0d233, transparent 35%),
              linear-gradient(120deg, #e6f6f4, #eef3fb 65%, #eaf0fb);
}
[data-theme="light"] .hero p { color: #4b6075; }
[data-theme="light"] .tag { background: #dff3f0; }
[data-theme="light"] .stat-icon,
[data-theme="light"] .feature-icon,
[data-theme="light"] .step-number { background: #dff3f0; }
[data-theme="light"] .activity-symbol { background: #e6eef7; }
[data-theme="light"] .result-box { background: #eaf8f5; border-color: #9fd8d0; }
[data-theme="light"] .result-box p { color: #2c4256; }
[data-theme="light"] .progress-track { background: #dbe4ee; }
[data-theme="light"] .check-item.done span { color: #94a3b8; }
[data-theme="light"] .btn-primary { color: #fff; }
[data-theme="light"] .btn-primary:hover { background: #0a7a6d; }
[data-theme="light"] .btn-danger { border-color: #f0b8bf; }
[data-theme="light"] .toast { background: #e7f7f4; border-color: #9fd8d0; }
[data-theme="light"] .feature-card:hover,
[data-theme="light"] .crime-card:hover { border-color: var(--accent); }

/* Details block in catalog cards */
.crime-details { margin-top: 14px; padding: 13px; border-radius: 10px; background: var(--input-bg, #0d1727); border: 1px solid var(--line); font-size: 11px; line-height: 1.7; color: var(--muted); }
.crime-details strong { color: var(--text); }
.feature-card { cursor: pointer; padding: 21px; }
.feature-card:focus-visible, .nav-link:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.nav-link { display: flex; align-items: center; }

/* ==========================================
   PLATFORMA: modda sahifalari, jadvallar, algoritmlar
========================================== */
@media (min-width: 761px) { .sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; } }
@media (max-width: 760px) { .sidebar { overflow-y: auto; } }
.sidebar .side-label { padding-top: 12px; }
.nav-menu { margin-bottom: 4px; }

.stats-grid.flex { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.stat-note.big { font-size: 11px; line-height: 1.5; margin-top: 8px; }
.panel.tight { margin-top: 16px; padding: 17px 19px; font-size: 12.5px; line-height: 1.7; }
.panel.flush { padding: 0; overflow: hidden; }
.panel h3 { margin-bottom: 8px; }
.sub-title { font-size: 18px; margin: 26px 0 8px; letter-spacing: -.4px; }
.sub-h { font-size: 14px; margin: 22px 0 10px; }
.crumb { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
.crumb a { color: var(--accent); cursor: pointer; }
ul.plain { margin: 6px 0 12px; padding-left: 20px; font-size: 12.5px; line-height: 1.7; color: var(--text); }
ul.plain li { margin: 3px 0; }
.small-note { font-size: 11px; color: var(--muted); line-height: 1.7; margin: 10px 0; }
.small-note a { color: var(--accent); cursor: pointer; }
.content-note { margin-top: 26px; padding: 10px 14px; border: 1px dashed var(--line); border-radius: 10px; font-size: 11px; color: var(--muted); }
.hl, mark.hl { background: #ffe77a; color: #1b1f24; border-radius: 3px; padding: 0 2px; }

.pill { display: inline-block; font-size: 10.5px; border-radius: 20px; padding: 3px 10px; margin: 8px 6px 0 0; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); }

/* tabs (usullar) */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 4px; }
.tabs button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 20px; padding: 7px 14px; font-size: 11.5px; transition: .2s; }
.tabs button:hover { border-color: var(--accent); }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: #06201e; font-weight: 700; }

/* versiyalar */
.vers { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.vers div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 12px; line-height: 1.6; color: var(--muted); }
.vers div b { color: var(--accent); }

/* ish varaqasi paneli */
.casebar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 22px 0 8px; font-size: 12px; }
.casebar label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.field.inline { width: 160px; padding: 8px 10px; }
.progress-track.grow { flex: 1; min-width: 120px; margin-top: 0; }

/* bosqichlar va qadamlar */

.step { display: flex; align-items: flex-start; gap: 11px; padding: 6px 0; font-size: 13px; line-height: 1.65; cursor: pointer; }

.callout ul { margin: 6px 0 0; padding-left: 20px; }
.callout.ok { border-color: #35d08a; background: rgba(53, 208, 138, .10); }
.callout.warn { border-color: var(--orange); background: rgba(255, 180, 94, .10); }
.callout.crit { border-color: var(--red); background: rgba(255, 107, 120, .10); margin: 22px 0; }

/* jadvallar */
.table-wrap { overflow-x: auto; max-width: 100%; }
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; line-height: 1.55; }

.panel.flush .data-table th, .panel.flush .data-table td { border-left: 0; border-right: 0; }
.data-table a, .res a, .wiz-link { color: var(--accent); cursor: pointer; }

.res { margin-top: 18px; font-size: 12.5px; line-height: 1.7; }
.res p { margin: 12px 0; }
.res a { display: inline-block; margin: 6px 8px 0 0; padding: 7px 13px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); font-weight: 600; }

.result-row, .prog-row { cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 16px; margin: 8px 0; font-size: 12.5px; transition: .2s; }
.result-row:hover, .prog-row:hover { border-color: var(--accent); }

.prog-row { display: grid; grid-template-columns: 1fr 180px; gap: 16px; align-items: center; }

[data-theme="light"] .data-table th { background: #eef3f9; }

function t(key, ...args) {
  const v = I[key] ? I[key][li()] : key;
  return typeof v === "string" ? v.replace(/\{(\d+)\}/g, (_, n) => args[n] ?? "") : v;
}
const tArr = key => I[key][li()];

const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

const findM = id => { for (const a of ART) for (const m of a.m) if (m.id === id) return [a, m]; return null; };
function expand(steps) {
  const out = [];
  for (const s of steps) {
    if (s.startsWith("@")) {
      const k = s.slice(1).split(" ")[0];
      const rest = s.slice(1 + k.length);
      (B[k] || [s]).forEach((x, i) => out.push(i === 0 && rest ? x + rest : x));
    } else out.push(s);
  }
  return out;
}
const stepsOf = m => m.stages.map(s => expand(s.s));
const keysOf = m => { const k = []; stepsOf(m).forEach((st, si) => st.forEach((_, i) => k.push(`${m.id}|${si}|${i}`))); return k; };
const EV_KEYS = () => EV.map((_, i) => "ev|" + i);

const GROUPS = [...new Set(ART.map(a => a.g))];
let blobCache = {};
function blobOf(a, m) {
  const key = lang === "ru" ? "ru" : "lat";
  const id = key + a.id + (m ? m.id : "");
  if (!blobCache[id]) {
    const base = [a.code, a.title, a.about, a.qual.join(" ")];
    const parts = m ? base.concat([m.n, m.mech, m.extra || "", stepsOf(m).flat().join(" "), m.key, m.err.join(" "), m.exp.join(" "), m.vers.flat().join(" ")]) : base.concat(a.m.map(x => x.n));
    blobCache[id] = tx(parts.join(" ")).toLowerCase();
  }
  return blobCache[id];
}

let lastQuery = "", lastGroup = "all";
function filterCatalog() {
  const box = $("#catResults");
  if (!box) return;
  const si = $("#crimeSearch"), sg = $("#crimeGroup");
  if (si) lastQuery = si.value; if (sg) lastGroup = sg.value;
  const q = tx(lastQuery.trim()).toLowerCase();
  const inGroup = a => lastGroup === "all" || GROUPS[Number(lastGroup)] === a.g;

  if (!q) {
    let h = "", g = "";
    const list = ART.filter(inGroup);
    h = '<div class="crime-grid">' + list.map(a => `
      <article class="crime-card" onclick="goTo('art','${a.id}')" onkeydown="if(event.key==='Enter'){goTo('art','${a.id}')}" role="button" tabindex="0">
        <span class="tag">${esc(artLabel(a.code))}</span>
        <h3>${esc(a.title)}</h3>
        <p>${esc(a.about)}</p>
        <div class="card-bottom"><small>${t("nMethods", a.m.length)} · ${esc(a.g)}</small><span class="btn">${t("open")}</span></div>
      </article>`).join("") + "</div>";
    box.innerHTML = list.length ? h : `<div class="empty-state">${t("noResults")}</div>`;
    return;
  }

  let n = 0, h = "";
  for (const a of ART) {
    if (!inGroup(a)) continue;
    for (const m of a.m) {
      if (!blobOf(a, m).includes(q)) continue;
      n++;
      const steps = stepsOf(m).flat();
      const hit = steps.find(s => tx(s).toLowerCase().includes(q)) || m.mech;
      h += `<div class="result-row" onclick="goTo('art','${a.id}','${m.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'){goTo('art','${a.id}','${m.id}')}">
        <b>${esc(artLabel(a.code))} · ${esc(m.n)}</b><div class="small-note">${hl(hit, q)}</div></div>`;
    }
  }
  box.innerHTML = n ? `<p class="small-note">${t("foundN", n)}</p>${h}` : `<div class="empty-state">${t("noResults")}</div>`;
}
function hl(s, q) {
  const d = tx(s), i = d.toLowerCase().indexOf(q);
  if (i < 0) return escRaw(d);
  return escRaw(d.slice(0, i)) + '<mark class="hl">' + escRaw(d.slice(i, i + q.length)) + "</mark>" + escRaw(d.slice(i + q.length));
}

  const done = () => showToast(t("copied")), fail = () => showToast(t("copyFail"));
  const legacy = () => {
    try { const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); ok ? done() : fail(); } catch (e) { fail(); }
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, legacy); else legacy();
}
function copyCase(mid) {
  const [a, m] = findM(mid);
  let out = `${t("caseWord")}: ${caseNo || "—"}\n${artLabel(a.code)} · ${tx(m.n)}\n`;
  m.stages.forEach((s, si) => {
    out += `\n${tx(s.t)}\n`;
    expand(s.s).forEach((x, i) => { out += `[${ticks[`${mid}|${si}|${i}`] ? "x" : " "}] ${tx(x)}\n`; });
  });
  copyText(out);
}

function articlePage() {
  const A = ART.find(x => x.id === route.a);
  if (!A) return `<div class="empty-state">${t("notFound")}</div>`;
  const m = A.m.find(x => x.id === route.m) || A.m[0];
  const st = stepsOf(m);
  let r = `${eyebrow("art")}
    <div class="crumb"><a onclick="goTo('catalog')">${t("p_catalog")}</a> › ${esc(A.g)} › ${esc(artLabel(A.code))}</div>
    <h1 class="page-title">${esc(artLabel(A.code))}. ${esc(A.title)}</h1>
    <p class="page-subtitle">${esc(A.about)}</p>
    <div class="panel tight"><h3>${t("qualH")}</h3><ul class="plain">${A.qual.map(q => `<li>${esc(q)}</li>`).join("")}</ul>
      <span class="pill">${t("pillCity", esc(A.st.t))}</span><span class="pill">${t("pillRegion", esc(A.st.x))}</span></div>`;
  if (A.m.length > 1) r += `<div class="tabs">${A.m.map(x => `<button class="${x.id === m.id ? "on" : ""}" onclick="goTo('art','${A.id}','${x.id}')">${esc(x.n)}</button>`).join("")}</div>`;
  r += `<h2 class="sub-title">${t("methodH")} ${esc(m.n)}</h2>${m.x ? `<span class="pill">${t("pillRegion", esc(m.x))}</span>` : ""}
    <div class="panel tight"><b>${t("mechH")}</b> ${esc(m.mech)}${m.extra ? `<br><b>${t("extraH")}</b> ${esc(m.extra)}` : ""}</div>
    <h3 class="sub-h">${t("versH")}</h3>
    <div class="vers">${m.vers.map(([a, b]) => `<div><b>${esc(a)}</b><br>${esc(b)}</div>`).join("")}</div>
    ${caseBar(keysOf(m), m.id)}
    <h3 class="sub-h">${t("algH")}</h3>`;
  m.stages.forEach((s, si) => {
    r += `<div class="stage ${si === 0 ? "first" : ""}"><h4>${esc(s.t)} <span class="cnt">${t("stepsN", st[si].length)}</span></h4>`;
    st[si].forEach((x, i) => {
      const k = `${m.id}|${si}|${i}`;
      r += `<label class="step ${ticks[k] ? "done" : ""}"><input type="checkbox" ${ticks[k] ? "checked" : ""} onchange="tick('${k}',this.checked,this)"><span>${esc(x)}</span></label>`;
    });
    r += "</div>";
  });
  r += `<div class="callout ok"><b>${t("keyH")}</b> ${esc(m.key)}</div>
    <div class="callout warn"><b>${t("errH")}</b><ul>${m.err.map(e => `<li>${esc(e)}</li>`).join("")}</ul></div>
    <h3 class="sub-h">${t("expH")}</h3><ul class="plain">${m.exp.map(e => `<li>${esc(e)}</li>`).join("")}</ul>
    <p class="small-note noprint">${t("alsoH")} <a onclick="goTo('expert')">${t("p_expert")}</a> · <a onclick="goTo('dead')">${t("p_dead")}</a></p>
    <div class="hero-actions noprint"><button class="btn" onclick="window.print()">${t("print")}</button></div>
    ${contentNote()}`;
  return r;
}

/* ==========================================================
   Kvalifikatsiya yordamchisi (daraxt)
   ========================================================== */
let wz = { step: "start", path: [], result: null };
function wizardPage() {
  let r = pageHead("wizard", t("wzLead"));
  if (wz.path.length) r += `<p class="small-note">${wz.path.map(esc).join(" → ")} · <a onclick="wzReset()">${t("wzRestart")}</a></p>`;
  if (wz.result) {
    r += `<div class="panel res"><h3>${t("wzResH")}</h3>` + wz.result.map(id => {
      const A = ART.find(x => x.id === id);
      return `<p><b>${esc(artLabel(A.code))}.</b> ${esc(A.title)}<br>${A.m.map(m => `<a onclick="goTo('art','${A.id}','${m.id}')">${esc(m.n)}</a>`).join("")}</p>`;
    }).join("") + `<p class="small-note">${t("wzResNote")}</p></div>`;
  } else {
    const s = WZ[wz.step];
    r += `<div class="panel wiz"><h3>${esc(s.q)}</h3>${s.o.map(([txt], i) => `<button onclick="wzGo(${i})">${esc(txt)}</button>`).join("")}</div>`;
  }
  return r + contentNote();
}
function wzGo(i) {
  const [txt, n] = WZ[wz.step].o[i];
  if (n.startsWith("p:")) { wzReset(true); goTo(n.slice(2)); return; }
  wz.path.push(txt);
  if (n.startsWith("r:")) wz.result = n.slice(2).split(";"); else wz.step = n;
  renderRoute(false);
}
function wzReset(silent) { wz = { step: "start", path: [], result: null }; if (!silent) renderRoute(false); }

/* ==========================================================
   Ma’lumotnoma sahifalari (pages.js)
   ========================================================== */
function docPage() {
  const fn = { universal, law, dead, expert, reject }[route.page];
  return `${eyebrow(route.page)}<div class="doc">${wrapTables(tx(fn()))}</div>${contentNote()}`;
}

/* ==========================================================
   Dalillar chek-listi
   ========================================================== */
function evidencePage() {
  const keys = EV_KEYS();
  return `${pageHead("evidence", t("evLead"))}
    ${caseBar(keys, null)}
    <div class="check-list">${EV.map((x, i) => {
      const k = "ev|" + i;
      return `<label class="check-item step ${ticks[k] ? "done" : ""}"><input type="checkbox" ${ticks[k] ? "checked" : ""} onchange="tick('${k}',this.checked,this)"><span>${esc(x)}</span></label>`;
    }).join("")}</div>${contentNote()}`;
}

/* ==========================================================
   Ish varaqasi
   ========================================================== */
function casePage() {
  const rows = {};
  Object.keys(ticks).forEach(k => { const id = k.split("|")[0]; if (id !== "ev") rows[id] = (rows[id] || 0) + 1; });
  const list = Object.entries(rows).map(([id, d]) => {
    const f = findM(id); if (!f) return "";
    const [a, m] = f, total = keysOf(m).length, pct = Math.round(d * 100 / total);
    return `<div class="prog-row" onclick="goTo('art','${a.id}','${m.id}')" role="button" tabindex="0"><div><b>${esc(artLabel(a.code))} · ${esc(m.n)}</b><small>${t("cbDone", d, total)}</small></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;
  }).join("");
  const evDone = EV_KEYS().filter(k => ticks[k]).length;
  const evRow = evDone ? `<div class="prog-row" onclick="goTo('evidence')" role="button" tabindex="0"><div><b>${t("p_evidence")}</b><small>${t("cbDone", evDone, EV.length)}</small></div><div class="progress-track"><div class="progress-fill" style="width:${Math.round(evDone * 100 / EV.length)}%"></div></div></div>` : "";

  return `${pageHead("case", t("caseDesc"))}
    <div class="panel" style="margin-top:22px"><div class="form-grid">
      <div class="form-group"><label>${t("caseNumber")}</label><input class="field" id="caseNumber" placeholder="${escRaw(t("cbPh"))}"></div>
      <div class="form-group"><label>${t("caseDate")}</label><input class="field" type="date" id="caseDate"></div>
      <div class="form-group full"><label>${t("caseName")}</label><input class="field" id="caseTitle" placeholder="${escRaw(t("caseNamePh"))}"></div>
      <div class="form-group full"><label>${t("caseDetails")}</label><textarea class="text-field" id="caseDetails" placeholder="${escRaw(t("caseDetailsPh"))}"></textarea></div>
      <div class="form-group full"><label>${t("caseEvidence")}</label><textarea class="text-field" id="caseEvidence" placeholder="${escRaw(t("caseEvidencePh"))}"></textarea></div>
      <div class="form-group full"><label>${t("caseTasks")}</label><textarea class="text-field" id="caseTasks" placeholder="${escRaw(t("caseTasksPh"))}"></textarea></div>
    </div>
    <div class="hero-actions" style="margin-top:18px">
      <button class="btn btn-primary" onclick="saveCase()">${t("save")}</button>
      <button class="btn" onclick="window.print()">${t("print")}</button>
      <button class="btn btn-danger" onclick="clearCase()">${t("clear")}</button>
    </div>
    <p class="panel-desc" style="margin-top:15px">${t("privacy")}</p></div>
    <div class="section-heading"><div><h2>${t("progH")}</h2></div></div>
    <div class="panel">${list || evRow ? list + evRow : `<p class="panel-desc">${t("progNone")}</p>`}</div>`;
}
const CASE_KEYS = ["caseNumber", "caseDate", "caseTitle", "caseDetails", "caseEvidence", "caseTasks"];
function loadCaseForm() {
  const data = lsJSON("kiberCase", {});
  CASE_KEYS.forEach(k => { const el = document.getElementById(k); if (el && data[k] !== undefined) el.value = data[k]; });
  const num = document.getElementById("caseNumber");
  if (num && !num.value && caseNo) num.value = caseNo;
}
function saveCase() {
  const data = {};
  CASE_KEYS.forEach(k => { data[k] = document.getElementById(k).value; });
  lsSet("kiberCase", JSON.stringify(data));
  const n = data.caseNumber.trim();
  if (n && n !== caseNo) switchCase(n);
  renderRoute(false);
  showToast(t("saved"));
}
function clearCase() {
  if (!confirm(t("confirmClear"))) return;
  lsDel("kiberCase");
  renderRoute(false);
  showToast(t("cleared"));
}

/* ==========================================================
   Bilimlar bazasi
   ========================================================== */
function knowledgePage() {
  return `${pageHead("knowledge", t("knowDesc"))}
    <div class="steps">${CONCEPTS.map(([name, desc], i) => `
      <div class="step-item"><div class="step-number">${String(i + 1).padStart(2, "0")}</div>
      <div><h3>${name[li()]}</h3><p>${desc[li()]}</p></div></div>`).join("")}</div>`;
}

/* ==========================================================
   Til, mavzu, mobil menyu
   ========================================================== */
const languageSelect = $("#languageSelect");
languageSelect.value = lang;
languageSelect.addEventListener("change", () => {
  lang = languageSelect.value;
  lsSet("kiberLanguage", lang);
  blobCache = {};
  const q = $("#crimeSearch") ? $("#crimeSearch").value : "";
  renderRoute(false);
  if (route.page === "catalog" && q) { $("#crimeSearch").value = q; filterCatalog(); }
});
$("#mobileMenu").addEventListener("click", () => $("#sidebar").classList.toggle("open"));

const themeSelect = $("#themeSelect");
const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme === "system" ? (systemTheme.matches ? "dark" : "light") : theme);
}
const savedTheme = ["system", "light", "dark"].includes(lsGet("kiberTheme")) ? lsGet("kiberTheme") : "system";
themeSelect.value = savedTheme;
applyTheme(savedTheme);
themeSelect.addEventListener("change", () => { lsSet("kiberTheme", themeSelect.value); applyTheme(themeSelect.value); });
systemTheme.addEventListener("change", () => { if (themeSelect.value === "system") applyTheme("system"); });

/* ---------- start ---------- */
parseHash();
renderRoute(true);

  </script>
